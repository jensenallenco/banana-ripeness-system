[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banana-ripeness-system"
version = "0.1.0"
description = "Portable foundation for the Cavendish banana research prototype"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
banana-system = "banana_system.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/banana_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
